# Leaf node (Raspberry Pi) for the `naive` profile.
#
# No `jetstream { }` block: this is core NATS only. The question this profile
# answers is what the leaf does with messages published to it while the
# leafnode link to the hub is down.
server_name: leaf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

leafnodes {
  remotes: [
    {
      # `nats-leaf://` is the leafnode scheme; `nats://` is also accepted.
      # Confirmed locally that this exact form connects.
      urls: ["nats-leaf://nats-hub:7422"]
    }
  ]
}
