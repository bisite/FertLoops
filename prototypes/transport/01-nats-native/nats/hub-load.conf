# Hub (VPS) for the `load` profile -- second prototype round.
#
# Identical to hub-jetstream.conf except for the store limits, raised for the
# same reason as on the leaf: the mirror has to be able to absorb the whole
# backlog, and a cap here would measure the cap rather than the catch-up.
server_name: hub

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  domain: hub
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 8GB
}

leafnodes {
  listen: 0.0.0.0:7422
}
