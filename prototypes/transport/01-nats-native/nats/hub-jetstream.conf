# Hub (VPS) for the `jetstream-mirror` profile.
#
# Its own JetStream domain, `hub`. The domain is what makes the two JetStream
# systems addressable separately across the leafnode link: a server with
# `domain: hub` answers its API on `$JS.hub.API.>` in addition to `$JS.API.>`,
# and the leafnode connection stops relaying the unqualified `$JS.API.>` so a
# client on the leaf cannot accidentally talk to the hub's JetStream.
server_name: hub

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  domain: hub
  store_dir: /data
}

leafnodes {
  listen: 0.0.0.0:7422
}
