# Leaf node (Raspberry Pi) for the `jetstream-mirror` profile.
#
# JetStream enabled with its own domain, `edge`, and a file store on a Docker
# volume so it survives the SIGKILL in phase P2. The hub mirrors the stream
# that lives here by addressing `$JS.edge.API` over the leafnode link.
server_name: leaf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  domain: edge
  store_dir: /data
  # Deliberately small so the whole experiment fits comfortably in RAM/disk on
  # a dev machine; the per-stream cap is what actually governs overflow and it
  # is set by the client (see consumer.py, EDGE_MAX_MSGS).
  max_memory_store: 64MB
  max_file_store: 512MB
}

leafnodes {
  remotes: [
    {
      urls: ["nats-leaf://nats-hub:7422"]
    }
  ]
}
