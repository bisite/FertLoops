# Hub (VPS) for the `naive` profile: plain core NATS, no JetStream at all.
server_name: hub

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

leafnodes {
  # Leaf nodes dial in here. 7422 is the NATS default leafnode port.
  listen: 0.0.0.0:7422
}

# Everything else is left at the server defaults on purpose: this profile
# measures what you get out of the box. In particular ping_interval stays at
# its 2m default, which is exactly why the link outage is not detected
# immediately -- see the README.
