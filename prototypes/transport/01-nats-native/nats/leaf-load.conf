# Leaf node (Raspberry Pi) for the `load` profile -- second prototype round.
#
# Same topology as leaf-jetstream.conf, which round one proved is the only
# documented path to durability at the edge. The difference is the limits: this
# round fills the stream to a real 15- to 30-day backlog, and the 512 MB cap
# used in round one was chosen to keep a 60-second experiment small.
#
# 518 400 frames x 347 B is ~180 MB of payload; JetStream adds per-message
# index and subject overhead on top. 8 GB is deliberately far above anything
# the experiment can reach, because an artificial cap would silently turn this
# into a measurement of the cap instead of a measurement of the product -- and
# the real Pi has a 1 TB SSD, so there is no cap to model.
server_name: leaf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  domain: edge
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 8GB
}

leafnodes {
  remotes: [
    {
      urls: ["nats-leaf://nats-hub:7422"]
    }
  ]
}
