# SQLite preflight probe. Run standalone (no network, no clients) by
# run-experiment.sh before the five phases, against whichever image the profile
# uses, to answer question 5 of issue #4: "is NanoMQ's bridge persistence really
# absent from the default package?"
#
# The probe is run twice with the same file:
#
#   A) with `mounted_file_path` pointing at a directory that does NOT exist.
#      An image WITHOUT SQLite starts up happily. An image WITH SQLite panics.
#   B) with that directory mounted and present.
#      An image WITHOUT SQLite leaves it empty. An image WITH SQLite creates
#      mqtt_client.db there.
#
# Both sub-checks are needed: A shows the failure mode, B shows the feature
# actually engaging. `bridges.mqtt.cache` is echoed back as `bridge.sqlite.*` in
# the startup config dump by BOTH images, which is the whole danger.

listeners.tcp {
    bind = "0.0.0.0:1883"
}

log {
    to = [console]
    level = info
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}

bridges.mqtt.hub {
    server = "mqtt-tcp://mosquitto-hub:1883"
    proto_ver = 4
    clientid = "fl-sqlite-probe"
    keepalive = 60s
    clean_start = false
    forwards = [
        {
            remote_topic = "fertloops/probe/reading"
            local_topic  = "fertloops/probe/reading"
            qos = 1
        }
    ]
    max_send_queue_len = 4096
    resend_interval = 5000
}

bridges.mqtt.cache {
    disk_cache_size = 102400
    mounted_file_path = "/nanomq/data/"
    flush_mem_threshold = 100
}
