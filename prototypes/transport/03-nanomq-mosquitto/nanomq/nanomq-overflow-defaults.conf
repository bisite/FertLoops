# Overflow probe for the `defaults` profile -- emqx/nanomq:latest.
#
# Not a realistic configuration. Its only job is to answer "when the bridge queue
# fills up, which end is thrown away, the oldest or the newest?", which no NanoMQ
# doc states. `max_send_queue_len` is set absurdly small so the answer shows up
# after a handful of messages instead of after thousands, and the surviving `seq`
# values say which end survived: survivors at the head of the outage window means
# the newest were discarded, survivors at the tail means the oldest were.
#
# No cache block: this measures the in-memory queue alone.

listeners.tcp {
    bind = "0.0.0.0:1883"
}

log {
    to = [console]
    level = info
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}

bridges.mqtt.hub {
    server = "mqtt-tcp://mosquitto-hub:1883"
    proto_ver = 4
    clientid = "fl-edge-bridge"
    keepalive = 60s
    clean_start = true
    forwards = [
        {
            remote_topic = "fertloops/A4:CF:12:34:56:78/reading"
            local_topic  = "fertloops/A4:CF:12:34:56:78/reading"
            qos = 1
        }
    ]
    max_parallel_processes = 2
    max_send_queue_len = 8
    max_recv_queue_len = 8
}
