# Profile `defaults` -- NanoMQ 0.25.5-6 on emqx/nanomq:latest (Alpine).
#
# What somebody gets by following nanomq.io/docs/en/latest/bridges/tcp-bridge.html
# and nothing else: a bridge with a QoS 1 forward, and every queue / persistence
# knob left alone. No `bridges.mqtt.cache` block, no `max_send_queue_len`.
#
# HOCON block style (NanoMQ >= 0.19). The old flat `nanomq.conf` key=value style
# is not used here.

listeners.tcp {
    bind = "0.0.0.0:1883"
}

# `to = [console]` only: the container's stdout is the evidence trail, and
# writing to /tmp/nanomq.log as well just duplicates it. level=info is enough to
# see the bridge connect/disconnect transitions; level=debug logs every single
# publish and drowns a 20 msg/s run.
log {
    to = [console]
    level = info
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}

bridges.mqtt.hub {
    server = "mqtt-tcp://mosquitto-hub:1883"
    proto_ver = 4
    clientid = "fl-edge-bridge"
    keepalive = 60s
    # Default from the docs' example. Nothing tuned.
    clean_start = true
    forwards = [
        {
            remote_topic = "fertloops/A4:CF:12:34:56:78/reading"
            local_topic  = "fertloops/A4:CF:12:34:56:78/reading"
            qos = 1
        }
    ]
}
