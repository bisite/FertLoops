# Profile `hardened` -- NanoMQ 0.25.5-6 on emqx/nanomq:0.25.5-slim (Debian).
#
# Same bridge as `defaults`, plus the three things the #4 report says are needed
# for an edge broker that has to survive a link outage and a power cut:
#
#   1. An image variant built with SQLite. emqx/nanomq:latest (Alpine) has no
#      sqlite3 symbols in the binary at all -- confirmed locally with
#      `grep -aoE "sqlite3_[a-z0-9_]+" /usr/local/nanomq/nanomq`, which returns
#      nothing on :latest and the full SQLite C API on :0.25.5-slim.
#   2. `bridges.mqtt.cache`, i.e. the disk cache. Present but inert on :latest.
#   3. QoS 1 on the forward. NanoMQ only queues/caches QoS >= 1 messages.

listeners.tcp {
    bind = "0.0.0.0:1883"
}

log {
    to = [console]
    level = info
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}

bridges.mqtt.hub {
    server = "mqtt-tcp://mosquitto-hub:1883"
    proto_ver = 4
    clientid = "fl-edge-bridge"
    keepalive = 60s
    # clean_start = false so the bridge session (and therefore its inflight
    # window) is not thrown away by the remote broker on reconnect.
    clean_start = false
    forwards = [
        {
            remote_topic = "fertloops/A4:CF:12:34:56:78/reading"
            local_topic  = "fertloops/A4:CF:12:34:56:78/reading"
            qos = 1
        }
    ]

    max_parallel_processes = 2
    # In-memory inflight window for the bridge, in messages. The docs show 32 in
    # the config-description page and 1024 in the tcp-bridge page, and the broker
    # does NOT echo the effective value in its startup config dump -- so the real
    # default is not knowable from the logs. Set explicitly and generously:
    # 60 s of outage at 20 msg/s is 1200 messages.
    max_send_queue_len = 4096
    max_recv_queue_len = 1024
    # Retry cadence for unacked QoS messages. Docs: "retry time shall be at least
    # 1/2 or 1/4 of keepalive".
    resend_interval = 5000
}

# The disk cache. `bridges.mqtt.cache` is the HOCON key; NanoMQ echoes it back in
# the startup dump as `bridge.sqlite.*`, which is how you tell it was parsed.
bridges.mqtt.cache {
    # Max messages held in SQLite. 102400 msgs at 1 sample / 10 s per drainage
    # table is ~11 days of outage for one table.
    disk_cache_size = 102400
    # Must be an EXISTING directory -- the -slim image panics at startup with
    # "Can't open database <path>/mqtt_client.db: unable to open database file"
    # if it is missing. Mounted as the `edge-data` named volume so it survives
    # the SIGKILL in phase P2.
    mounted_file_path = "/nanomq/data/"
    # Flush to SQLite once this many messages are held in memory. Low on purpose:
    # this is the NanoMQ equivalent of Mosquitto's autosave_interval, and a high
    # value is exactly what turns a power cut into data loss.
    flush_mem_threshold = 100
}
