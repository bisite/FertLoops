# Overflow probe for the `hardened` profile -- emqx/nanomq:0.25.5-slim.
#
# Same purpose as nanomq-overflow-defaults.conf, but with the SQLite cache
# enabled and `disk_cache_size` also set absurdly small, so the probe measures
# which end the *disk* cache discards, not just the in-memory queue.

listeners.tcp {
    bind = "0.0.0.0:1883"
}

log {
    to = [console]
    level = info
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}

bridges.mqtt.hub {
    server = "mqtt-tcp://mosquitto-hub:1883"
    proto_ver = 4
    clientid = "fl-edge-bridge"
    keepalive = 60s
    clean_start = false
    forwards = [
        {
            remote_topic = "fertloops/A4:CF:12:34:56:78/reading"
            local_topic  = "fertloops/A4:CF:12:34:56:78/reading"
            qos = 1
        }
    ]
    max_parallel_processes = 2
    max_send_queue_len = 8
    max_recv_queue_len = 8
    resend_interval = 5000
}

bridges.mqtt.cache {
    disk_cache_size = 32
    mounted_file_path = "/nanomq/data/"
    flush_mem_threshold = 4
}
