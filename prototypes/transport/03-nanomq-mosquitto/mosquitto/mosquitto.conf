# Hub broker (the VPS side). Deliberately NOT the variable under test.
#
# This prototype measures what the NanoMQ edge broker does while the link is
# down, so the hub is configured to never be the bottleneck: unbounded queues
# and persistence on. If a message reaches this broker it is counted as
# delivered.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# Mosquitto's default is 1000 queued messages per offline durable subscriber and
# it drops *newly arriving* messages once the cap is hit -- confirmed on branch
# research/mqtt-timescaledb-bento-sandbox by setting it to 5 and watching
# "Outgoing messages are being dropped" after 10 publishes. Unbounded here so
# that any loss we measure is attributable to the edge, not to the hub.
max_queued_messages 0
max_queued_bytes 0

# The consumer connects with clean_session=false; keep its session forever so a
# brief consumer hiccup is not mistaken for a transport loss.
persistent_client_expiration 365d
