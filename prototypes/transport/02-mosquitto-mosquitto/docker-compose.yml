# Throwaway prototype for issue #4: Mosquitto (edge) --bridge--> Mosquitto (hub).
#
# Project name is fixed so this can run at the same time as the sibling
# prototypes without colliding on container/network names. No host ports are
# published for the same reason: every client is a container on these networks.
name: fl-proto-mosq

services:
  # The Raspberry Pi's broker. Sits on `edge` (simulator side) and `link`
  # (the VPN to the VPS). Cutting `link` is what simulates the outage.
  #
  # eclipse-mosquitto has no granular patch-version tag (2.1.2) on Docker Hub,
  # only rolling "2" -- pinned by digest instead so this doesn't silently
  # change later. Currently resolves to mosquitto 2.1.2.
  edge-broker:
    image: eclipse-mosquitto@sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87
    container_name: fl-proto-mosq-edge-broker
    # Deliberately NO restart policy: phase P2 kills this container with
    # SIGKILL and the experiment script decides when it comes back.
    volumes:
      - ./config/${FL_PROFILE:?set FL_PROFILE}/edge.conf:/mosquitto/config/mosquitto.conf:ro
      - edge-data:/mosquitto/data
    networks:
      - edge
      - link
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The VPS broker. Sits on `link` (bridge side) and `hub` (consumer side).
  hub-broker:
    image: eclipse-mosquitto@sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87
    container_name: fl-proto-mosq-hub-broker
    volumes:
      - ./config/${FL_PROFILE:?set FL_PROFILE}/hub.conf:/mosquitto/config/mosquitto.conf:ro
      - hub-data:/mosquitto/data
    networks:
      - link
      - hub
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Stands in for the Pi's UART reader: publishes ESP32 frames at 20 msg/s to
  # the local broker and records exactly what the local broker acknowledged.
  simulator:
    build: .
    image: fl-proto-mosq-client
    container_name: fl-proto-mosq-simulator
    command: ["/app/simulator.py"]
    environment:
      BROKER_HOST: edge-broker
      RATE_HZ: "20"
      RESULTS_DIR: /results
    volumes:
      - results:/results
    networks:
      - edge
    depends_on:
      edge-broker:
        condition: service_healthy

  # Stands in for whatever ingests on the VPS. Durable session, QoS 1.
  consumer:
    build: .
    image: fl-proto-mosq-client
    container_name: fl-proto-mosq-consumer
    command: ["/app/consumer.py"]
    environment:
      BROKER_HOST: hub-broker
      RESULTS_DIR: /results
    volumes:
      - results:/results
    networks:
      - hub
    depends_on:
      hub-broker:
        condition: service_healthy

  # ---------------------------------------------------------------- load round
  # Second prototype round (S1-S4): the same brokers at the real horizon --
  # 12 drainage tables, 347 B frames, a backlog of up to 518 400 messages.
  # Under the `load` compose profile so `up -d simulator consumer` still means
  # the round-one outage experiment and nothing else.

  # ONE client publishing to twelve topics, because the real Pi runs one reader
  # process for all twelve ESP32s. See src/load_simulator.py.
  load-simulator:
    build: .
    image: fl-proto-mosq-client
    container_name: fl-proto-mosq-load-simulator
    command: ["/app/load_simulator.py"]
    environment:
      BROKER_HOST: edge-broker
      RESULTS_DIR: /results
      TARGET_MSGS: ${TARGET_MSGS:-518400}
      N_DEVICES: ${N_DEVICES:-12}
      DRAIN_RATE_HZ: ${DRAIN_RATE_HZ:-20}
    volumes:
      - results:/results
    networks:
      - edge
    profiles: [load]

  load-consumer:
    build: .
    image: fl-proto-mosq-client
    container_name: fl-proto-mosq-load-consumer
    command: ["/app/load_consumer.py"]
    environment:
      BROKER_HOST: hub-broker
      RESULTS_DIR: /results
      CAPACITY: ${CAPACITY:-800000}
    volumes:
      - results:/results
    networks:
      - hub
    profiles: [load]

  # The Pi side of the control path: receives setpoints the VPS issued.
  cmd-consumer:
    build: .
    image: fl-proto-mosq-client
    container_name: fl-proto-mosq-cmd-consumer
    command: ["/app/cmd_consumer.py"]
    environment:
      BROKER_HOST: edge-broker
      RESULTS_DIR: /results
    volumes:
      - results:/results
    networks:
      - edge
    profiles: [load]

  # One-shot: publishes commands on the hub while the Pi is unreachable.
  commander:
    build: .
    image: fl-proto-mosq-client
    command: ["/app/commander.py"]
    environment:
      BROKER_HOST: hub-broker
      RESULTS_DIR: /results
      CMD_COUNT: ${CMD_COUNT:-60}
      N_DEVICES: ${N_DEVICES:-12}
    volumes:
      - results:/results
    networks:
      - hub
    profiles: [manual]

  load-verifier:
    build: .
    image: fl-proto-mosq-client
    command: ["/app/load_verifier.py"]
    environment:
      RESULTS_DIR: /results
      MSGS_15D: ${MSGS_15D:-259200}
      MSGS_30D: ${MSGS_30D:-518400}
    volumes:
      - results:/results
    profiles: [manual]

  # Run manually at the end of the experiment (`docker compose run verifier`).
  verifier:
    build: .
    image: fl-proto-mosq-client
    command: ["/app/verifier.py"]
    environment:
      RESULTS_DIR: /results
      FL_PROFILE: ${FL_PROFILE:?set FL_PROFILE}
    volumes:
      - results:/results
    networks:
      - hub
    profiles:
      - manual

networks:
  edge:
  link:
  hub:

volumes:
  edge-data:
  hub-data:
  results:
