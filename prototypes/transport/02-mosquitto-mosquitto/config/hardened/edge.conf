# Profile `hardened` -- edge broker (Raspberry Pi).
#
# The corrected configuration proposed by the issue #4 research. Every line
# below that is not in config/defaults/edge.conf is there to answer one
# specific failure mode; the comments say which.

listener 1883
allow_anonymous true

# Without this the queue lives only in RAM: a power cut takes everything.
persistence true
persistence_location /mosquitto/data/
# Default is 1800 s. That is 30 minutes of readings lost to a power cut, so it
# is the single most damaging default in the file. 5 s is aggressive on
# purpose: this prototype has to be able to *measure* the loss window.
autosave_interval 5

# Default is 1000 messages per client. Whether that cap governs the bridge's
# outbound queue is exactly what config/queue-probe/ measures; here it is
# lifted so `hardened` is not silently capped at ~2,8 h of outage.
max_queued_messages 0
max_queued_bytes 0
# With the bridge topic at QoS 1 below this is belt-and-braces, but it also
# covers anything published to the local broker at QoS 0.
queue_qos0_messages true

connection to-hub
address hub-broker:1883
# Stable client ids on both ends so the persisted session is reattached after
# a restart instead of being treated as a brand-new client.
clientid fl-edge-bridge
local_clientid fl-edge-bridge-local
# false keeps the remote subscriptions/session across a link drop. This is
# already the Mosquitto default for bridges; stated explicitly because the
# whole prototype hinges on it.
cleansession false
try_private true
# The QoS on the `topic` line is what makes the local broker queue for the
# bridge at all. Omitting it (the default, QoS 0) is the bug.
topic fertloops/# out 1
notifications false
