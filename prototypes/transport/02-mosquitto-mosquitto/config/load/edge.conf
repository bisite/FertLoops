# Profile `load` -- edge broker (Raspberry Pi), second prototype round.
#
# Same corrections as config/hardened/edge.conf, because the point of this
# round is NOT to re-litigate the defaults (round one settled those) but to
# find out what the *recommended* configuration costs at the real horizon:
# 12 drainage tables x 1 message/60 s x 15 days = 259 200 messages queued.
#
# Two deliberate differences from `hardened`, both documented here so the
# numbers stay attributable:
#
#   1. `topic fertloops/+/cmd in 1` -- the return path for control commands.
#      Round one never published a single command, so half of issue #4 went
#      unmeasured. `in` makes the bridge subscribe on the *hub* and republish
#      locally, which means the hub has to queue commands for a disconnected
#      bridge exactly as the edge queues readings for a disconnected hub.
#
#   2. `restart_timeout 2 8` -- round one measured the bridge sitting idle for
#      up to 20,6 s after the link returned, because the default is
#      decorrelated jitter with a 30 s cap. That is harmless for loss but it
#      pollutes any measurement of *drain time*, which is what S2 measures.
#      Bounding it makes the drain number mean what it says.

listener 1883
allow_anonymous true

# Instrumentation only, and the one knob here that is NOT part of the proposed
# production config. $SYS/broker/store/messages/count is how the run script
# gets the broker's own count of what it is holding, independently of what the
# publisher thinks it got PUBACKed. The default of 10 s would make each sample
# cost 10 s of waiting. Publishing $SYS does not touch queueing.
sys_interval 2

# Without this the queue lives only in RAM: a power cut takes everything.
persistence true
persistence_location /mosquitto/data/
# The `hardened` value from round one. Kept on purpose: with a queue of
# ~180 MB, every autosave rewrites the whole database, and whether that is
# survivable on a Pi is itself one of the things this round measures.
autosave_interval 5

# No cap. Round one proved a cap discards the NEWEST message and keeps the
# queue shut until the bridge drains, which extends the damage past the end of
# the outage. `0` removes that failure mode and buys an OOM question instead --
# and the RSS slope measured here is what answers it.
max_queued_messages 0
max_queued_bytes 0
queue_qos0_messages true

connection to-hub
address hub-broker:1883
clientid fl-edge-bridge
local_clientid fl-edge-bridge-local
cleansession false
try_private true
# Readings go out; commands come in. Both at QoS 1, because round one proved
# Mosquitto never upgrades outgoing QoS and a QoS 0 bridge degrades the whole
# path end to end.
topic fertloops/+/reading out 1
topic fertloops/+/cmd in 1
notifications false
restart_timeout 2 8
