# Profile `load` -- hub broker (VPS), second prototype round.
#
# Same corrections at the receiving end. `max_queued_messages 0` matters twice
# here: once so the consumer's durable session is not capped, and once so the
# hub can queue control commands for the bridge while the Raspberry Pi is
# unreachable -- which is the S4 scenario.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 5

max_queued_messages 0
max_queued_bytes 0
queue_qos0_messages true
