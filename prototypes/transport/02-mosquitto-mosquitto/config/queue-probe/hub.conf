# Profile `hardened` -- hub broker (VPS).
#
# Same corrections applied at the receiving end, so the consumer's durable
# session survives a hub restart and is not capped at 1000 messages either.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 5

max_queued_messages 0
max_queued_bytes 0
queue_qos0_messages true
