# Profile `queue-probe` -- edge broker (Raspberry Pi).
#
# Identical to config/hardened/edge.conf EXCEPT that max_queued_messages and
# max_queued_bytes are not set at all, so they keep their shipped defaults
# (1000 messages / no byte limit).
#
# Purpose: answer open question 1 of issue #4 -- does max_queued_messages
# actually govern the *bridge's* outbound queue? P1 publishes 1200 messages
# into a down bridge. If the cap governs the bridge queue, exactly 1000 come
# out the other side and the Mosquitto log says so.
#
# The hub keeps max_queued_messages 0 so any drop is unambiguously the edge
# bridge queue and not the hub's queue for the consumer.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 5

queue_qos0_messages true

connection to-hub
address hub-broker:1883
clientid fl-edge-bridge
local_clientid fl-edge-bridge-local
cleansession false
try_private true
topic fertloops/# out 1
notifications false
