# Profile `defaults` -- edge broker (Raspberry Pi).
#
# Deliberately the bare minimum needed to (a) accept remote connections at all
# on Mosquitto 2.x and (b) make the bridge connect. Nothing else is set, so
# every queueing/persistence knob keeps its shipped default:
#
#   persistence          -> false  (in-memory only, nothing survives a reboot)
#   autosave_interval    -> 1800   (irrelevant while persistence is false)
#   max_queued_messages  -> 1000   (per client)
#   max_queued_bytes     -> 0      (no byte limit)
#   queue_qos0_messages  -> false  (QoS 0 is NOT queued for offline clients)
#   bridge topic QoS     -> 0      (because the `topic` line omits it)
#   cleansession (bridge)-> false
#
# This is what someone gets by following a "how to bridge Mosquitto" tutorial.

listener 1883
allow_anonymous true

connection to-hub
address hub-broker:1883
topic fertloops/# out
