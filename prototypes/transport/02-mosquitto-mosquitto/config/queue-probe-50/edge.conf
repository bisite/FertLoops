# Profile `queue-probe-50` -- edge broker (Raspberry Pi).
#
# Identical to config/queue-probe/edge.conf except the cap is set explicitly to
# an absurdly small 50. This is the control for the probe: if the boundary
# observed in `queue-probe` moves from 1000 to 50 when this one line changes,
# then max_queued_messages provably governs the bridge's outbound queue -- no
# deduction required.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 5

max_queued_messages 50

queue_qos0_messages true

connection to-hub
address hub-broker:1883
clientid fl-edge-bridge
local_clientid fl-edge-bridge-local
cleansession false
try_private true
topic fertloops/# out 1
notifications false
