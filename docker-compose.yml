services:
  mosquitto:
    # eclipse-mosquitto has no granular patch-version tag (2.1.2) on Docker
    # Hub, only rolling "2" -- pinned by digest instead so this doesn't
    # silently change later. Currently resolves to mosquitto 2.1.2.
    image: eclipse-mosquitto@sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87
    container_name: fertloops-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.29.0-pg16
    container_name: fertloops-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: fertloops
      POSTGRES_PASSWORD: fertloops
      POSTGRES_DB: fertloops
    ports:
      - "5433:5432"
    volumes:
      - ./timescaledb/init:/docker-entrypoint-initdb.d
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fertloops -d fertloops"]
      interval: 5s
      timeout: 5s
      retries: 5

  bento:
    image: ghcr.io/warpstreamlabs/bento:1.20.0
    container_name: fertloops-bento
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - ./bento/fertloops.yaml:/bento.yaml
      - ./bento/failed:/bento_data
    command: ["-c", "/bento.yaml"]
    ports:
      - "4195:4195"

volumes:
  mosquitto-data:
  mosquitto-log:
  timescaledb-data:
