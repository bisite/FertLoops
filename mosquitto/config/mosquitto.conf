listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Mosquitto's default (1000 messages per offline durable subscriber) silently
# drops newly-arriving messages once the cap is hit -- confirmed locally by
# setting this to 5 and watching "Outgoing messages are being dropped" in the
# log after only 10 publishes. Unbounded here for the sandbox; the real number
# for the VPS broker is a sizing decision for issue #4/#6, not a default to
# inherit by accident.
max_queued_messages 0
max_queued_bytes 0
